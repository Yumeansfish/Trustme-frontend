name: Notify Backend Release Build

on:
  push:
    branches: [main]

jobs:
  notify-backend:
    if: github.repository == 'Yumeansfish/Trustme-frontend' && secrets.TRUSTME_BACKEND_DISPATCH_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch backend rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.TRUSTME_BACKEND_DISPATCH_TOKEN }}
          repository: Yumeansfish/Trustme-backend
          event-type: frontend-updated
          client-payload: '{"frontend_ref":"${{ github.sha }}"}'
